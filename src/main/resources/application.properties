spring.application.name=finflow-backend

#Server Port
server.port=8080

#MySql Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/finflow_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA / Hibernate Auto DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------
# KAFKA CONFIGURATION
# ----------------------------------------------------
# 1. Broker Connection (Where Kafka is listening)
spring.kafka.bootstrap-servers=localhost:9092

# 2. Producer Settings (How Spring converts Java Objects -> Bytes over the wire)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# 3. Consumer Settings (How Spring reads Bytes -> Java Objects)
spring.kafka.consumer.group-id=finflow-audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ----------------------------------------------------
# MONGODB CONFIGURATION (Audit Store)
# ----------------------------------------------------
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=finflow_audit



